name: Release

on:
  push:
    tags:
      - 'mini-v*'
      - 'lang-v*'
      - 'compiler-v*'
      - 'bootstrap-v*'
      - 'std-v*'
      - 'vscode-v*'
      - 'cli-v*'
      - 'check-v*'
      - 'format-v*'
      - 'lsp-v*'
      - 'test-v*'
      - 'verify-v*'
      - 'bench-v*'
      - 'release-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag whose CI has passed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: node dist/ci.js {0}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: revision
        shell: bash
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Bootstrap generated tools
        shell: bash
        run: ./bin/bootstrap
      - name: Install VS Code packaging dependencies
        if: startsWith(inputs.release_tag || github.ref_name, 'vscode-v')
        run: install
      - name: Verify tag and package committed sources
        run: package
        env:
          MINI_RELEASE_TAG: ${{ inputs.release_tag }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.revision.outputs.short }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: package
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - id: revision
        shell: bash
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Bootstrap generated tools
        shell: bash
        run: ./bin/bootstrap
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ steps.revision.outputs.short }}
          path: dist/release
      - name: Upload draft assets, then publish
        shell: node dist/ci.js {0}
        run: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MINI_RELEASE_TAG: ${{ inputs.release_tag }}
